<body>
  <!-- [ Pre-loader ] start -->

    <div class="loader-track">
      <div class="loader-fill"></div>

  </div>
  <!-- [ Pre-loader ] End -->

  <!-- [ Sidebar Menu ] start -->
  <nav class="pc-sidebar">

      <div class="m-header">
        <a href="#" class="b-brand text-primary">
          <h4 class="m-0 text-primary fw-bold">IFundas San Juan</h4>
        </a>
      </div>
      <div class="navbar-content">
        <ul class="pc-navbar">
          <li class="pc-item pc-caption">

          <li class="pc-item">

          </li>

        </ul>

  </nav>

  <!-- [ Header Topbar ] start -->

    <div class="header-wrapper">
      <div class="me-auto pc-mob-drp">
        <ul class="list-unstyled">
          <li class="pc-h-item pc-sidebar-collapse">
            <a href="#" class="pc-head-link ms-0" id="sidebar-hide">

          </li>

      </div>
      <div class="ms-auto">
        <ul class="list-unstyled">
          <li class="dropdown pc-h-item header-user-profile">

  <!-- [ Main Content ] start -->
  <div class="pc-container">
    <div class="pc-content">
      <div class="row">
        <div class="col-sm-12">
          <div class="card table-card">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center p-4 pb-0">
                <h5 class="mb-0">Cartera de Clientes</h5>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modal-agregar-cliente">
                  <i class="ti ti-plus f-18 me-1"></i> Agregar Cliente
                </button>
              </div>
              <div class="table-responsive p-4">
                <table class="table table-hover align-middle mb-0">
                  <thead class="table-light">
                    <tr>
                      <th>#ID</th>
                      <th>Cliente</th>
                      <th>Email</th>
                      <th>Teléfono</th>
                      <th>Dirección</th>
                      <th class="text-center">Acciones</th>
                    </tr>
                  </thead>
                  <tbody id="tabla-clientes">
                    <tr>
                      <td colspan="6" class="text-center py-4">Cargando clientes...</td>

                  </tbody>

            </div>

        </div>
      </div>
    </div>
  </div>

  <!-- [ Modal Agregar Cliente ] start -->
  <div class="modal fade" id="modal-agregar-cliente" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Nuevo Cliente</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="form-crear-cliente">
          <div class="modal-body">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" id="cli-nombre" placeholder="Ej: Juan" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Apellido</label>
                <input type="text" class="form-control" id="cli-apellido" placeholder="Ej: Pérez" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="cli-email" placeholder="cliente@correo.com" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Teléfono</label>
              <input type="text" class="form-control" id="cli-telefono" placeholder="264-1234567">
            </div>
            <div class="mb-3">
              <label class="form-label">Dirección</label>
              <input type="text" class="form-control" id="cli-direccion" placeholder="Calle, Barrio, Departamento">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar Cliente</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <!-- [ Modal Agregar Cliente ] end -->

  <!-- Required Js -->
  <script src="../assets/js/plugins/popper.min.js"></script>
  <script src="../assets/js/plugins/simplebar.min.js"></script>
  <script src="../assets/js/plugins/bootstrap.min.js"></script>
  <script src="../assets/js/fonts/custom-font.js"></script>
  <script src="../assets/js/pcoded.js"></script>
  <script src="../assets/js/plugins/feather.min.js"></script>

  <script>layout_change('light');</script>
  <script>preset_change("preset-1");</script>
  <script>font_change("Public-Sans");</script>

  <!-- Lógica Dinámica de Clientes -->
  <script>
    const token = localStorage.getItem('token');
    const usuarioGuardado = JSON.parse(localStorage.getItem('usuario') || '{}');

    if (!token) {
      window.location.href = '/admin/login.html';
    } else {
      if (usuarioGuardado.nombre) {
        document.getElementById('user-display-name').textContent = usuarioGuardado.nombre;
      }
    }

    function cerrarSesion() {
      localStorage.removeItem('token');
      localStorage.removeItem('usuario');
      window.location.href = '/admin/login.html';
    }

    async function cargarClientes() {
      try {
        const res = await fetch('/api/clientes');
        const clientes = await res.json();
        const tbody = document.getElementById('tabla-clientes');
        tbody.innerHTML = '';

        if (!clientes || clientes.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">No hay clientes registrados</td></tr>';
          return;
        }

        clientes.forEach(c => {
          tbody.innerHTML += `
            <tr>
              <td class="text-muted fw-bold">#${c.id}</td>
              <td><strong>${c.nombre} ${c.apellido}</strong></td>
              <td>${c.email}</td>
              <td>${c.telefono || '-'}</td>
              <td>${c.direccion || '-'}</td>
              <td class="text-center">
                <button onclick="eliminarCliente(${c.id})" class="btn btn-sm btn-outline-danger" title="Eliminar">
                  <i class="ti ti-trash"></i>
                </button>
              </td>
            </tr>
          `;
        });
      } catch (err) {
        console.error('Error al cargar clientes:', err);
      }
    }

    document.getElementById('form-crear-cliente').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nuevoCliente = {
        nombre: document.getElementById('cli-nombre').value,
        apellido: document.getElementById('cli-apellido').value,
        email: document.getElementById('cli-email').value,
        telefono: document.getElementById('cli-telefono').value,
        direccion: document.getElementById('cli-direccion').value
      };

      try {
        const res = await fetch('/api/clientes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(nuevoCliente)
        });

        const data = await res.json();

        if (res.ok) {
          const modalEl = document.getElementById('modal-agregar-cliente');
          const modal = bootstrap.Modal.getInstance(modalEl);
          modal.hide();
          document.getElementById('form-crear-cliente').reset();
          cargarClientes();
        } else {
          alert(data.mensaje || 'Error al guardar cliente');
        }
      } catch (err) {
        alert('Error de conexión');
      }
    });

    async function eliminarCliente(id) {
      if (!confirm('¿Seguro que deseas eliminar este cliente?')) return;
      try {
        const res = await fetch(`/api/clientes/${id}`, { method: 'DELETE' });
        if (res.ok) {
          cargarClientes();
        } else {
          alert('No se pudo eliminar el cliente');
        }
      } catch (err) {
        alert('Error de conexión');
      }
    }

    cargarClientes();
  </script>
</body>
</html>
